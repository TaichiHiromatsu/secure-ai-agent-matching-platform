<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Secure Mediation A2A Platform</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
    }
    #firebaseui-auth-container {
      margin-top: 20px;
    }
    .error-message {
      color: #e74c3c;
      margin-top: 20px;
      display: none;
    }
    .deployment-notice {
      color: #8a4b00;
      background: #fff3cd;
      border: 1px solid #ffda6a;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Secure Mediation A2A Platform</h1>
    <div id="deployment-notice" class="deployment-notice"></div>
    <p>Please sign in to continue</p>
    <div id="firebaseui-auth-container"></div>
    <div id="error-message" class="error-message"></div>
  </div>

  <script>
    const errorElement = document.getElementById('error-message');
    let exchangeInFlight = false;

    fetch('/auth/deployment', {credentials: 'same-origin'})
      .then(response => response.json())
      .then(deployment => {
        if (deployment.ephemeral) {
          const notice = document.getElementById('deployment-notice');
          notice.textContent = deployment.notice;
          notice.style.display = 'block';
        }
      });

    function showError(error) {
      errorElement.textContent = 'Authentication error: ' + error.message;
      errorElement.style.display = 'block';
    }

    async function establishServerSession(user, csrfToken) {
      if (exchangeInFlight) return;
      exchangeInFlight = true;
      try {
        const idToken = await user.getIdToken(true);
        const response = await fetch('/auth/session', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({id_token: idToken})
        });
        if (!response.ok) throw new Error('server session exchange failed');
        window.location.replace('/?app=payment_user_agent');
      } catch (error) {
        exchangeInFlight = false;
        showError(error);
      }
    }

    Promise.all([
      fetch('/auth/firebase-config', {credentials: 'same-origin'}).then(response => {
        if (!response.ok) throw new Error('Firebase configuration unavailable');
        return response.json();
      }),
      fetch('/auth/csrf', {credentials: 'same-origin'}).then(response => {
        if (!response.ok) throw new Error('CSRF initialization failed');
        return response.json();
      })
    ]).then(([firebaseConfig, csrf]) => {
      firebase.initializeApp(firebaseConfig);
      const ui = new firebaseui.auth.AuthUI(firebase.auth());
      ui.start('#firebaseui-auth-container', {
        signInOptions: [firebase.auth.EmailAuthProvider.PROVIDER_ID],
        signInFlow: 'popup',
        callbacks: {
          signInSuccessWithAuthResult: function(authResult) {
            establishServerSession(authResult.user, csrf.csrfToken);
            return false;
          },
          signInFailure: function(error) {
            showError(error);
          }
        }
      });
      firebase.auth().onAuthStateChanged(function(user) {
        if (user) establishServerSession(user, csrf.csrfToken);
      });
    }).catch(showError);
  </script>
</body>
</html>
