worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Any client-supplied owner selector is rejected before auth bridge/store
    # access. The verified assertion is injected later from auth_request and
    # is never taken from one of these browser headers.
    map "$http_x_verified_identity$http_x_subject$http_x_subject_id$http_x_tenant$http_x_tenant_id$http_x_user_id$http_x_customer_id$http_x_session_id$http_x_adk_session_id$http_x_mediation_session_id$http_x_workflow_id$http_user_id$http_subject$http_tenant_id" $has_client_identity_selector {
        "" 0;
        default 1;
    }

    # Extract only the non-secret double-submit token. The Firebase session
    # cookie itself is forwarded exclusively to the internal auth_request.
    map $http_cookie $csrf_cookie_value {
        default "";
        "~*(?:^|;\\s*)__Host-payment-csrf=(?<csrf_cookie_token>[^;]+)" $csrf_cookie_token;
    }

    upstream payment_adk {
        server 127.0.0.1:8000;
    }

    upstream auth_service {
        server 127.0.0.1:8003;
    }

    upstream workflow_api {
        server 127.0.0.1:8004;
    }

    server {
        listen 8080;
        server_name _;
        port_in_redirect off;
        absolute_redirect off;

        set $external_scheme $scheme;
        if ($http_x_forwarded_proto != "") {
            set $external_scheme $http_x_forwarded_proto;
        }

        # Liveness reveals no internal process, revision, or storage details.
        location = /health {
            if ($request_method != GET) { return 404; }
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        location = /login {
            if ($request_method != GET) { return 404; }
            root /app/static;
            try_files /login.html =404;
            default_type text/html;
        }

        location = /login/ {
            if ($request_method != GET) { return 404; }
            root /app/static;
            try_files /login.html =404;
            default_type text/html;
        }

        # Public authentication bootstrap is an exact method/path allowlist.
        location = /auth/csrf {
            if ($request_method != GET) { return 404; }
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_pass http://auth_service/auth/csrf;
        }

        location = /auth/firebase-config {
            if ($request_method != GET) { return 404; }
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_pass http://auth_service/auth/firebase-config;
        }

        location = /auth/deployment {
            if ($request_method != GET) { return 404; }
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_pass http://auth_service/auth/deployment;
        }

        location = /auth/browser-bootstrap {
            if ($request_method != GET) { return 404; }
            if ($has_client_identity_selector) { return 403; }
            auth_request /auth/verify;
            auth_request_set $verified_identity $upstream_http_x_verified_identity;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Verified-Identity $verified_identity;
            proxy_pass http://auth_service/auth/browser-bootstrap;
        }

        location = /auth/browser-bootstrap.js {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            alias /app/static/csrf-bootstrap.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        location = /auth/session {
            if ($request_method != POST) { return 404; }
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header X-Verified-CSRF-Cookie $csrf_cookie_value;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_pass http://auth_service/auth/session;
        }

        location = /auth/logout {
            if ($request_method != POST) { return 404; }
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header X-Verified-CSRF-Cookie $csrf_cookie_value;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_pass http://auth_service/auth/logout;
        }

        # Only nginx may call this endpoint. Direct external access is 404.
        location = /auth/verify {
            internal;
            proxy_pass_request_headers off;
            proxy_pass http://auth_service/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Original-Method $request_method;
        }

        # Internal services and legacy surfaces are never public, authenticated
        # or otherwise. Exact and prefix forms intentionally have the same 404.
        location = /store { return 404; }
        location ^~ /store/ { return 404; }
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location = /ws { return 404; }
        location ^~ /ws/ { return 404; }
        location = /a2a { return 404; }
        location ^~ /a2a/ { return 404; }
        location = /v1 { return 404; }
        location ^~ /v1/ { return 404; }
        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }
        location = /payment { return 404; }
        location ^~ /payment/ { return 404; }
        location = /paid-agent { return 404; }
        location ^~ /paid-agent/ { return 404; }
        location = /auth/internal { return 404; }
        location ^~ /auth/internal/ { return 404; }

        # Sole authenticated ADK application and its exact browser API.
        location = / {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            error_page 401 = @login_redirect;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_set_header User-Agent $http_user_agent;
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/auth/browser-bootstrap.js"></script>';
            proxy_pass http://payment_adk;
        }

        location = /dev-ui/ {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_set_header User-Agent $http_user_agent;
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/auth/browser-bootstrap.js"></script>';
            proxy_pass http://payment_adk/dev-ui/;
        }

        location ~ "^/dev-ui/(?:main|polyfills|chunk|styles)-[A-Z0-9]+\\.(?:js|css)$" {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_pass http://payment_adk;
        }

        location = /dev-ui/adk_favicon.svg {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_pass http://payment_adk;
        }

        location ~ "^/dev-ui/assets/(?:audio-processor\\.js|ADK-512-color\\.svg|config/runtime-config\\.json)$" {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_pass http://payment_adk;
        }

        location = /list-apps {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_pass http://payment_adk;
        }

        location ~ "^/static/(?:[A-Za-z0-9_-][A-Za-z0-9._~-]*/)*[A-Za-z0-9_-][A-Za-z0-9._~-]*$" {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_pass http://payment_adk;
        }

        # ADK's packaged browser currently emits a small set of root-level
        # hashed bundles and fixed assets. Keep this authenticated allowlist
        # narrow so arbitrary paths cannot fall through to the ADK server.
        location ~ "^/(?:main|polyfills|chunk|styles)-[A-Z0-9]+\\.(?:js|css)$" {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_pass http://payment_adk;
        }

        location = /adk_favicon.svg {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_pass http://payment_adk;
        }

        location ~ "^/assets/(?:audio-processor\\.js|ADK-512-color\\.svg|config/runtime-config\\.json)$" {
            if ($request_method != GET) { return 404; }
            auth_request /auth/verify;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_pass http://payment_adk;
        }

        location ~ "^/apps/payment_user_agent/users/[A-Za-z0-9][A-Za-z0-9._~-]{0,127}/sessions(?:/[A-Za-z0-9][A-Za-z0-9._~-]{0,127}){0,4}$" {
            if ($request_method !~ "^(GET|POST|DELETE)$") { return 404; }
            if ($has_client_identity_selector) { return 403; }
            auth_request /auth/verify;
            auth_request_set $verified_identity $upstream_http_x_verified_identity;
            auth_request_set $verified_csrf $upstream_http_x_csrf_validated;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Verified-CSRF $verified_csrf;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Accept $http_accept;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Verified-Identity $verified_identity;
            proxy_pass http://auth_service;
        }

        location = /run {
            if ($request_method != POST) { return 404; }
            if ($has_client_identity_selector) { return 403; }
            auth_request /auth/verify;
            auth_request_set $verified_identity $upstream_http_x_verified_identity;
            auth_request_set $verified_csrf $upstream_http_x_csrf_validated;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Verified-CSRF $verified_csrf;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Accept $http_accept;
            proxy_set_header X-Verified-Identity $verified_identity;
            proxy_pass http://auth_service;
        }

        location = /run_sse {
            if ($request_method != POST) { return 404; }
            if ($has_client_identity_selector) { return 403; }
            auth_request /auth/verify;
            auth_request_set $verified_identity $upstream_http_x_verified_identity;
            auth_request_set $verified_csrf $upstream_http_x_csrf_validated;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Verified-CSRF $verified_csrf;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Accept $http_accept;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header X-Verified-Identity $verified_identity;
            proxy_pass http://auth_service;
        }

        # Authenticated workflow façade. Browser-supplied identity headers are
        # not forwarded because request headers are disabled; only the signed
        # assertion returned by the auth subrequest is injected.
        location = /mediation-api/ready {
            if ($request_method != GET) { return 404; }
            if ($has_client_identity_selector) { return 403; }
            auth_request /auth/verify;
            auth_request_set $verified_identity $upstream_http_x_verified_identity;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Verified-Identity $verified_identity;
            proxy_pass http://auth_service/mediation-api/ready;
        }

        location = /mediation-api/v1/turns {
            if ($request_method != POST) { return 404; }
            if ($has_client_identity_selector) { return 403; }
            auth_request /auth/verify;
            auth_request_set $verified_identity $upstream_http_x_verified_identity;
            auth_request_set $verified_csrf $upstream_http_x_csrf_validated;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Verified-CSRF $verified_csrf;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Verified-Identity $verified_identity;
            proxy_pass http://auth_service/mediation-api/v1/turns;
        }

        location = /mediation-api/v1/view {
            if ($request_method != GET) { return 404; }
            if ($has_client_identity_selector) { return 403; }
            auth_request /auth/verify;
            auth_request_set $verified_identity $upstream_http_x_verified_identity;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header Accept $http_accept;
            proxy_set_header X-Verified-Identity $verified_identity;
            proxy_pass http://auth_service/mediation-api/v1/view;
        }

        location ^~ /mediation-api/ {
            return 403;
        }

        # Unknown paths and method variants are handled at the edge, without
        # disclosing whether an internal upstream exists.
        location / {
            return 404;
        }

        location @login_redirect {
            return 302 /login;
        }
    }
}
