[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/app/start-nginx.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
priority=100

[program:trusted_agent_store]
command=/app/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app/trusted_agent_store
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app/trusted_agent_store:/app/jury-judge-worker:/app/evaluation-runner/src",DATABASE_URL="sqlite:////app/trusted_agent_store/data/agent_store.db",URL_PREFIX="/store"
priority=20

[program:payment_user_agent]
command=/app/.venv/bin/adk web /app/payment-apps --host 127.0.0.1 --port 8000
directory=/app/payment-apps
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:external_agents]
command=/app/.venv/bin/python /app/external-agents/trusted-agents/a2a_server.py --host 127.0.0.1 --port 8002 /app/external-agents/trusted-agents
directory=/app/external-agents/trusted-agents
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

[program:auth_service]
command=/app/.venv/bin/uvicorn verify:app --host 127.0.0.1 --port 8003
directory=/app/auth
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:paid_booking_merchant]
command=/app/.venv/bin/uvicorn secure_mediation_agent.merchant.api:app --host 127.0.0.1 --port 8005
directory=/app/internal
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PAYMENT_MARKETPLACE_DB="/app/payment-data/marketplace.db",PAYMENT_MERCHANT_DB="/app/payment-data/paid-agent.db",PAYMENT_EVIDENCE_DB="/app/payment-evidence/evidence.db"
priority=45

[program:workflow_api]
command=/app/.venv/bin/uvicorn secure_mediation_agent.workflow.api:app --host 127.0.0.1 --port 8004
directory=/app/internal
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PAYMENT_MARKETPLACE_DB="/app/payment-data/marketplace.db",PAYMENT_MERCHANT_DB="/app/payment-data/paid-agent.db",PAYMENT_EVIDENCE_DB="/app/payment-evidence/evidence.db",PAYMENT_DURABLE_VOLUME_MARKER="/app/payment-data/.durable-volume",PAYMENT_EVIDENCE_VOLUME_MARKER="/app/payment-evidence/.durable-volume",WORKFLOW_PUBLIC_URL="http://localhost:8080/mediation-api"
priority=50

[program:workflow_outbox_worker]
command=/app/.venv/bin/python -m secure_mediation_agent.workflow.worker
directory=/app/internal
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PAYMENT_MARKETPLACE_DB="/app/payment-data/marketplace.db",PAYMENT_MERCHANT_DB="/app/payment-data/paid-agent.db",PAYMENT_EVIDENCE_DB="/app/payment-evidence/evidence.db",PAYMENT_DURABLE_VOLUME_MARKER="/app/payment-data/.durable-volume",PAYMENT_EVIDENCE_VOLUME_MARKER="/app/payment-evidence/.durable-volume"
priority=55
