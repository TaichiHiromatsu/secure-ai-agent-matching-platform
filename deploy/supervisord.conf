[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/app/start-nginx.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
priority=100

[program:trusted_agent_store]
command=/app/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app/trusted_agent_store
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app/trusted_agent_store:/app/jury-judge-worker:/app/evaluation-runner/src",DATABASE_URL="sqlite:////app/trusted_agent_store/data/agent_store.db",URL_PREFIX="/store"
priority=20

[program:secure_mediation_agent]
command=uv run --directory /app adk web /app/secure_mediation_agent --host 127.0.0.1 --port 8000
directory=/app/secure_mediation_agent
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:external_agents]
command=uv run --directory /app python /app/external-agents/trusted-agents/a2a_server.py --host 127.0.0.1 --port 8002 /app/external-agents/trusted-agents
directory=/app/external-agents/trusted-agents
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

[program:auth_service]
command=/app/.venv/bin/uvicorn verify:app --host 127.0.0.1 --port 8003
directory=/app/auth
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:payment_marketplace]
command=/app/.venv/bin/uvicorn secure_mediation_agent.payment_marketplace.api:app --host 127.0.0.1 --port 8004
directory=/app/secure_mediation_agent
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PAYMENT_MARKETPLACE_DB="/app/payment-data/marketplace.db",PAYMENT_EVIDENCE_DB="/app/payment-evidence/evidence.db",PAYMENT_MERCHANT_URL="http://127.0.0.1:8005",PAYMENT_DEMO_ALLOW_LOOPBACK="1",PAYMENT_DEMO_ENABLE_RAIL_FAULTS="1",PAYMENT_PUBLIC_URL="http://localhost:8080/payment"
priority=50

[program:paid_booking_agent]
command=/app/.venv/bin/python /app/external-agents/paid-booking-agent/app.py --host 127.0.0.1 --port 8005
directory=/app/external-agents/paid-booking-agent
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PAYMENT_DEMO_MERCHANT_HMAC_KEY="test-only-demo-merchant-key-v1",PAYMENT_DEMO_MEDIATOR_HMAC_KEY="test-only-demo-mediator-key-v1",PAYMENT_DEMO_MERCHANT_DB="/app/payment-data/paid-agent.db",PAYMENT_DEMO_ENABLE_MERCHANT_FAULTS="1",PAID_BOOKING_AGENT_PUBLIC_URL="http://localhost:8080/paid-agent"
priority=45
